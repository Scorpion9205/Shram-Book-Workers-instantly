name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values that satisfy the Zod-validated env schema (config/env.ts) at import time.
      # The test suite mocks Prisma/Redis directly, so no real database or cache is needed here.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/shram_ci"
      JWT_ACCESS_SECRET: "ci-placeholder-access-secret-at-least-32-chars"
      JWT_REFRESH_SECRET: "ci-placeholder-refresh-secret-at-least-32-chars"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "ci-placeholder-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
